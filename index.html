<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Khatm</title>
  <meta name="description" content="Structural signer for Apple Mach-O and IPA.">
  <style>
    :root { color-scheme: dark; --ink:#12100e; --panel:#1c1915; --line:#3a332b; --parchment:#f3eee4; --muted:#a89880; --brass:#d4b072; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--ink); color: var(--parchment); }
    body { min-height: 100vh; font: 16px/1.5 "IBM Plex Sans", "Segoe UI", sans-serif; }
    main { max-width: 40rem; margin: 0 auto; padding: 4.5rem 1.25rem 3rem; }
    .mark { width: 2.75rem; height: 2.75rem; border: 1px solid var(--brass); border-radius: 999px; display: grid; place-items: center; }
    .mark i { width: .85rem; height: .85rem; border: 1px solid var(--brass); transform: rotate(45deg); }
    p.k { margin: 1.25rem 0 0; font: 500 12px/1 ui-monospace, monospace; letter-spacing: .22em; color: var(--brass); }
    h1 { margin: .4rem 0 0; font-size: 2.4rem; font-weight: 500; }
    .lead { max-width: 28rem; margin: .8rem 0 0; color: var(--muted); }
    section { margin-top: 2.2rem; border: 1px solid var(--line); background: var(--panel); }
    section h2 { margin: 0; padding: 1rem 1.1rem .2rem; font-size: 1rem; font-weight: 500; }
    dl { margin: 0; padding: .4rem 1.1rem 1rem; }
    div.row { display: grid; gap: .15rem; padding: .7rem 0; border-top: 1px solid var(--line); }
    dt { color: var(--muted); font-size: .8rem; }
    dd { margin: 0; font: 14px/1.4 ui-monospace, monospace; word-break: break-all; }
    footer { margin-top: 1.5rem; color: var(--muted); font-size: .8rem; }
    a { color: var(--brass); }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"><i></i></div>
    <p class="k">KHATM</p>
    <h1>Khatm</h1>
    <p class="lead">Structural signer for Apple Mach-O and IPA. The package on this host is what iOS fetches.</p>
    <section>
      <h2>This host</h2>
      <dl>
        <div class="row"><dt>Manifest</dt><dd>application/xml</dd></div>
        <div class="row"><dt>Package</dt><dd>application/octet-stream</dd></div>
        <div class="row"><dt>Install</dt><dd>itms-services → the manifest on this site</dd></div>
      </dl>
    </section>
    <footer><a href="https://github.com/jdjsbdvd7-arch/khatm-ota">jdjsbdvd7-arch/khatm-ota</a></footer>
  </main>
</body>
</html>
