name: Method
on:
  push:
    branches: [main]
    paths-ignore:
      - catalog.json
      - pkg/*.xml
  pull_request:
  workflow_dispatch:
    inputs:
      udid:
        description: Device UDID
        required: false
        type: string
permissions:
  contents: write
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Engine
        run: node --experimental-strip-types engine/selftest.ts
  publish:
    needs: prove
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install links
        env:
          UDID: ${{ github.event.inputs.udid }}
        run: node --experimental-strip-types engine/catalog.ts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json pkg
          git diff --cached --quiet || git commit -m "Refresh install links."
          git push
